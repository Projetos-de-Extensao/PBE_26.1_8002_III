<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}IbIntern{% endblock %}</title>
  <style>
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }

    body {
      margin: 0;
      padding: 0;
      width: 100% !important;
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .email-wrapper {
      width: 100%;
      background-color: #f4f6f9;
      padding: 40px 0;
    }

    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    .email-header {
      background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%);
      padding: 32px 40px;
      text-align: center;
    }

    .email-header h1 {
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .email-header .subtitle {
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      margin-top: 6px;
      font-weight: 400;
    }

    .email-body {
      padding: 40px;
    }

    .greeting {
      font-size: 18px;
      color: #1a237e;
      font-weight: 600;
      margin: 0 0 16px 0;
    }

    .content {
      font-size: 15px;
      line-height: 1.7;
      color: #424242;
      margin: 0 0 24px 0;
    }

    .status-badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-aprovado {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .status-reprovado {
      background-color: #fce4ec;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .status-pendente {
      background-color: #fff3e0;
      color: #e65100;
      border: 1px solid #ffcc80;
    }

    .status-info {
      background-color: #e3f2fd;
      color: #1565c0;
      border: 1px solid #90caf9;
    }

    .info-box {
      background-color: #f5f7fa;
      border-left: 4px solid #3949ab;
      border-radius: 0 8px 8px 0;
      padding: 20px 24px;
      margin: 24px 0;
    }

    .info-box p {
      margin: 0;
      font-size: 14px;
      color: #546e7a;
      line-height: 1.6;
    }

    .info-box .label {
      font-weight: 600;
      color: #37474f;
      display: block;
      margin-bottom: 4px;
    }

    .divider {
      border: none;
      border-top: 1px solid #e8eaed;
      margin: 24px 0;
    }

    .email-footer {
      background-color: #fafafa;
      padding: 24px 40px;
      text-align: center;
      border-top: 1px solid #e8eaed;
    }

    .email-footer p {
      font-size: 12px;
      color: #9e9e9e;
      margin: 4px 0;
      line-height: 1.5;
    }

    .email-footer .brand {
      font-weight: 600;
      color: #1a237e;
    }

  </style>
  {% block extra_styles %}{% endblock %}
</head>
<body>
  <div class="email-wrapper">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
      <tr>
        <td align="center">
          <div class="email-container">
            <!-- Header -->
            <div class="email-header">
              <!-- TODO: Substituir o src abaixo pela URL ou caminho da logo do IbIntern que você enviou -->
              <img src="https://seu-dominio.com.br/static/img/logo-ibintern.png" alt="IbIntern Logo" style="max-height: 60px; height: auto; border: 0; outline: none; text-decoration: none;">
              <p class="subtitle">Gestão de Estágios Obrigatórios</p>
            </div>

            <!-- Body -->
            <div class="email-body">
              {% block body %}{% endblock %}
            </div>

            <!-- Footer -->
            <div class="email-footer">
              <p>Este é um email automático do sistema <span class="brand">IbIntern</span>.</p>
              <p>Por favor, não responda a este email.</p>
              <p>&copy; {{ ano_atual }} Ibmec — Todos os direitos reservados.</p>
            </div>
          </div>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
