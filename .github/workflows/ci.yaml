name: Testes

on:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o código
        uses: actions/checkout@v4

      - name: Instala Python e uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"

      - name: Instala dependências do projeto
        run: uv sync --frozen

      - name: Gera as migrações do banco
        run: uv run python manage.py makemigrations

      - name: Executa os testes com pytest
        env:
          GEMINI_API_KEY: "dummy-key-for-ci"
        run: uv run pytest