name: Testes  
on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: unbuntu-latest

    steps:

      - name: Baixa o código
        uses: actions/checkout@v4

      - name: Instala Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instala uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Instala dependências
        run: uv sync

      - name: roda Testes
        run: pytest