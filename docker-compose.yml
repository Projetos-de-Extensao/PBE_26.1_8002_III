services:
  web:
    build: .
    container_name: pbe-web
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python seed.py &&
             echo '------------------------------------------------------------' &&
             echo '🚀 API do Django disponível em: http://localhost:8000' &&
             echo '------------------------------------------------------------' &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_data:/app/media
      - /app/.venv
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-ibintern-local}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      rabbitmq:
        condition: service_healthy

  celery:
    build: .
    container_name: pbe-celery
    command: celery -A setup worker -l info
    volumes:
      - .:/app
      - media_data:/app/media
      - /app/.venv
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-ibintern-local}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      rabbitmq:
        condition: service_healthy

  # frontend:
  #   Desativado temporariamente pois o diretório ./interface/ibintern não existe neste repositório.
  #   Para reativar quando a interface for adicionada, descomente as linhas abaixo:
  #   build: ./interface/ibintern
  #   container_name: pbe-frontend
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./interface/ibintern:/app
  #     - /app/node_modules
  #   environment:
  #     - NODE_ENV=development

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pbe-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
  media_data:

