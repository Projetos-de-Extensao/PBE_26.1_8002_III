services:
  web:
    build: .
    container_name: pbe-web
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python seed.py &&
             echo '------------------------------------------------------------' &&
             echo '🚀 API do Django disponível em: http://localhost:8000' &&
             echo '📊 Metabase: http://localhost:3000' &&
             echo '------------------------------------------------------------' &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_data:/app/media
      - /app/.venv
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-ibintern-local}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      - DATABASE_URL=${DATABASE_URL:?Defina DATABASE_URL no .env com a connection string do Supabase}
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      rabbitmq:
        condition: service_started

  celery:
    build: .
    container_name: pbe-celery
    command: celery -A setup worker -l info
    volumes:
      - .:/app
      - media_data:/app/media
      - /app/.venv
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-ibintern-local}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      - DATABASE_URL=${DATABASE_URL:?Defina DATABASE_URL no .env com a connection string do Supabase}
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      rabbitmq:
        condition: service_started

  frontend:
    build: ./frontend/ibintern
    container_name: pbe-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/ibintern:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development


  metabase:
    image: metabase/metabase:latest
    container_name: pbe-metabase
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=h2
      - MB_EMBEDDING_SECRET_KEY=${METABASE_SECRET_KEY:-my-metabase-dev-secret-key-change-in-production}
    volumes:
      - metabase_data:/metabase-data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pbe-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  metabase_data:
  rabbitmq_data:
  media_data:

